name: Build ScrollShot AppImage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrollshot-appimage-build
  cancel-in-progress: true

env:
  APPIMAGE_NAME: scrollshot.AppImage
  RELEASE_TAG: continuous

jobs:
  build-x86_64:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            desktop-file-utils \
            file \
            python3-tk \
            python3-venv \
            xvfb

      - name: Create isolated build environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-build.txt

      - name: Check Python syntax
        run: |
          .venv/bin/python -m py_compile src/*.py tests/*.py

      - name: Run unit tests
        run: |
          .venv/bin/python -m unittest discover -s tests -v

      - name: Test selection preview and X11 input handling
        run: |
          xvfb-run -a -s "-screen 0 800x600x24" \
            .venv/bin/python tests/x11_selection_preview.py
          xvfb-run -a -s "-screen 0 800x600x24" \
            .venv/bin/python tests/x11_selection_input.py

      - name: Build bundled application directory
        run: |
          .venv/bin/pyinstaller \
            --clean \
            --noconfirm \
            --onedir \
            --name scrollshot \
            --hidden-import tkinter \
            --hidden-import Xlib.ext.xtest \
            src/scrollshot_app.py
          test -x dist/scrollshot/scrollshot

      - name: Assemble AppDir
        run: |
          rm -rf ScrollShot.AppDir
          install -d \
            ScrollShot.AppDir/usr/lib \
            ScrollShot.AppDir/usr/share/applications \
            ScrollShot.AppDir/usr/share/icons/hicolor/scalable/apps
          cp -a dist/scrollshot ScrollShot.AppDir/usr/lib/scrollshot
          install -m 0755 packaging/AppRun ScrollShot.AppDir/AppRun
          install -m 0644 \
            packaging/scrollshot.desktop \
            ScrollShot.AppDir/usr/share/applications/scrollshot.desktop
          install -m 0644 \
            assets/scrollshot.svg \
            ScrollShot.AppDir/usr/share/icons/hicolor/scalable/apps/scrollshot.svg
          ln -s usr/share/applications/scrollshot.desktop ScrollShot.AppDir/scrollshot.desktop
          ln -s usr/share/icons/hicolor/scalable/apps/scrollshot.svg ScrollShot.AppDir/scrollshot.svg
          ln -s scrollshot.svg ScrollShot.AppDir/.DirIcon
          desktop-file-validate ScrollShot.AppDir/scrollshot.desktop
          test -x ScrollShot.AppDir/AppRun
          test -x ScrollShot.AppDir/usr/lib/scrollshot/scrollshot

      - name: Build AppImage
        run: |
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --location \
            --retry 3 \
            --output appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            ./appimagetool-x86_64.AppImage \
            ScrollShot.AppDir \
            "dist/${APPIMAGE_NAME}"
          chmod +x "dist/${APPIMAGE_NAME}"

      - name: Test AppImage with fixed window regions
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 "dist/${APPIMAGE_NAME}" --version | grep -F 'ScrollShot 0.2.0'
          file "dist/${APPIMAGE_NAME}" | grep -F 'ELF 64-bit'
          rm -f /tmp/scrollshot-ci.png
          xvfb-run -a -s "-screen 0 800x600x24" bash -c '
            set -euo pipefail
            .venv/bin/python tests/x11_demo.py &
            demo_pid=$!
            trap "kill ${demo_pid} 2>/dev/null || true" EXIT
            sleep 1
            APPIMAGE_EXTRACT_AND_RUN=1 dist/scrollshot.AppImage \
              --geometry 0,0,420,420 \
              --delay 0.25 \
              --settle-delay 0.1 \
              --max-frames 30 \
              --stable-rounds 2 \
              --output /tmp/scrollshot-ci.png
          '
          .venv/bin/python - <<'PY'
          import cv2

          image = cv2.imread("/tmp/scrollshot-ci.png")
          assert image is not None
          assert image.shape[1] == 420, image.shape
          assert image.shape[0] > 450, image.shape
          PY

      - name: Generate checksum
        run: |
          cd dist
          sha256sum "${APPIMAGE_NAME}" > "${APPIMAGE_NAME}.sha256"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrollshot-AppImage
          path: |
            dist/${{ env.APPIMAGE_NAME }}
            dist/${{ env.APPIMAGE_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release delete-asset "${RELEASE_TAG}" "ScrollShot-x86_64.AppImage" --yes 2>/dev/null || true
            gh release delete-asset "${RELEASE_TAG}" "ScrollShot-x86_64.AppImage.sha256" --yes 2>/dev/null || true
            gh release upload "${RELEASE_TAG}" \
              "dist/${APPIMAGE_NAME}" \
              "dist/${APPIMAGE_NAME}.sha256" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "dist/${APPIMAGE_NAME}" \
              "dist/${APPIMAGE_NAME}.sha256" \
              --target "${GITHUB_SHA}" \
              --title "ScrollShot Continuous" \
              --notes "Automatically built and tested AppImage from the latest main branch commit." \
              --latest
          fi
