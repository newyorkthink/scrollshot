name: Build Linux executable

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrollshot-build
  cancel-in-progress: false

jobs:
  build-x86_64:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv xvfb

      - name: Create isolated build environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-build.txt

      - name: Run unit tests
        run: |
          .venv/bin/python -m unittest discover -s tests -v

      - name: Build standalone executable
        run: |
          .venv/bin/pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --name scrollshot \
            --hidden-import tkinter \
            --hidden-import Xlib.ext.xtest \
            src/scrollshot.py
          chmod +x dist/scrollshot

      - name: Test executable in X11 virtual display
        run: |
          dist/scrollshot --version
          xvfb-run -a -s "-screen 0 800x600x24" bash -c '
            set -e
            .venv/bin/python tests/x11_demo.py &
            demo_pid=$!
            trap "kill ${demo_pid} 2>/dev/null || true" EXIT
            sleep 1
            dist/scrollshot \
              --geometry 0,0,400,400 \
              --scroll-ticks 6 \
              --delay 0.55 \
              --settle-delay 0.1 \
              --max-frames 20 \
              --stable-rounds 2 \
              --output /tmp/scrollshot-ci.png
          '
          .venv/bin/python - <<'PY'
          import cv2

          image = cv2.imread("/tmp/scrollshot-ci.png")
          assert image is not None
          assert image.shape[0] > 800, image.shape
          PY

      - name: Generate checksum
        run: |
          sha256sum dist/scrollshot > dist/scrollshot-x86_64.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrollshot-x86_64
          path: |
            dist/scrollshot
            dist/scrollshot-x86_64.sha256
          if-no-files-found: error
          retention-days: 14
