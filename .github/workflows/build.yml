name: Build ScrollShot AppImage

on:
  push:
    branches:
      - main
  issue_comment:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrollshot-appimage-build
  cancel-in-progress: true

env:
  APPIMAGE_NAME: ScrollShot-x86_64.AppImage
  RELEASE_TAG: continuous

jobs:
  build-x86_64:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.number == 1 &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.comment.body, '/build '))
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve source commit
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            desktop-file-utils \
            file \
            python3-tk \
            python3-venv \
            xvfb

      - name: Create isolated build environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-build.txt

      - name: Run unit tests
        run: |
          .venv/bin/python -m unittest discover -s tests -v

      - name: Build bundled application directory
        run: |
          .venv/bin/pyinstaller \
            --clean \
            --noconfirm \
            --onedir \
            --name scrollshot \
            --hidden-import tkinter \
            --hidden-import Xlib.ext.xtest \
            src/scrollshot.py
          test -x dist/scrollshot/scrollshot

      - name: Assemble AppDir
        run: |
          rm -rf ScrollShot.AppDir
          install -d \
            ScrollShot.AppDir/usr/lib \
            ScrollShot.AppDir/usr/share/applications \
            ScrollShot.AppDir/usr/share/icons/hicolor/scalable/apps
          cp -a dist/scrollshot ScrollShot.AppDir/usr/lib/scrollshot
          install -m 0755 packaging/AppRun ScrollShot.AppDir/AppRun
          install -m 0644 \
            packaging/scrollshot.desktop \
            ScrollShot.AppDir/usr/share/applications/scrollshot.desktop
          install -m 0644 \
            assets/scrollshot.svg \
            ScrollShot.AppDir/usr/share/icons/hicolor/scalable/apps/scrollshot.svg
          ln -s usr/share/applications/scrollshot.desktop ScrollShot.AppDir/scrollshot.desktop
          ln -s usr/share/icons/hicolor/scalable/apps/scrollshot.svg ScrollShot.AppDir/scrollshot.svg
          ln -s scrollshot.svg ScrollShot.AppDir/.DirIcon
          desktop-file-validate ScrollShot.AppDir/scrollshot.desktop
          test -x ScrollShot.AppDir/AppRun
          test -x ScrollShot.AppDir/usr/lib/scrollshot/scrollshot

      - name: Build AppImage
        run: |
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --location \
            --retry 3 \
            --output appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            ./appimagetool-x86_64.AppImage \
            ScrollShot.AppDir \
            "dist/${APPIMAGE_NAME}"
          chmod +x "dist/${APPIMAGE_NAME}"

      - name: Test AppImage in X11 virtual display
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 "dist/${APPIMAGE_NAME}" --version
          file "dist/${APPIMAGE_NAME}" | grep -F 'ELF 64-bit'
          rm -f /tmp/scrollshot-ci.png
          xvfb-run -a -s "-screen 0 800x600x24" bash -c '
            set -euo pipefail
            .venv/bin/python tests/x11_demo.py &
            demo_pid=$!
            trap "kill ${demo_pid} 2>/dev/null || true" EXIT
            sleep 1
            APPIMAGE_EXTRACT_AND_RUN=1 dist/ScrollShot-x86_64.AppImage \
              --geometry 0,0,400,400 \
              --scroll-ticks 6 \
              --delay 0.55 \
              --settle-delay 0.1 \
              --max-frames 20 \
              --stable-rounds 2 \
              --output /tmp/scrollshot-ci.png
          '
          .venv/bin/python - <<'PY'
          import cv2

          image = cv2.imread("/tmp/scrollshot-ci.png")
          assert image is not None
          assert image.shape[0] > 800, image.shape
          PY

      - name: Generate checksum
        run: |
          cd dist
          sha256sum "${APPIMAGE_NAME}" > "${APPIMAGE_NAME}.sha256"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrollShot-x86_64-AppImage
          path: |
            dist/ScrollShot-x86_64.AppImage
            dist/ScrollShot-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="${SOURCE_SHA}" \
              -F force=true

            gh release upload "${RELEASE_TAG}" \
              "dist/${APPIMAGE_NAME}" \
              "dist/${APPIMAGE_NAME}.sha256" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "dist/${APPIMAGE_NAME}" \
              "dist/${APPIMAGE_NAME}.sha256" \
              --target "${SOURCE_SHA}" \
              --title "ScrollShot Continuous" \
              --notes "Automatically built and tested AppImage from the latest main branch commit." \
              --latest
          fi
